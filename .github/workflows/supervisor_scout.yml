name: Free PhD Supervisor Scraper (Zero-Cost Local NLP)

on:
  schedule:
    - cron: '0 8,16 * * 1-5' # Runs at 8:00 AM and 4:00 PM UTC, Monday to Friday
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write # Needed to save seen_urls.txt back to the repository

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Scraper
        env:
          RESEARCH_TOPIC: "Computer Science"
          RECRUITMENT_TIMEFRAME: "Fall 2026"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/phd_supervisor_scout.py

      - name: Commit Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/seen_urls.txt || echo "No seen_urls file"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(scout): update seen URLs database" && git push)
